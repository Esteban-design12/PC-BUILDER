<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="stylesRegister.css" />
</head>
<body>
  <!-- Fondo animado -->
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-grid"></div>
    <div class="auth-glow"></div>
    <div class="auth-orbs">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  
  

  <main class="wrap">
    <section class="card">
      <form class="panel" id="register-panel" autocomplete="on">
        <h1>Crea tu cuenta</h1>
        <p class="subtitle">Únete y disfruta del contenido</p>

        <div class="input-row">
          <div class="input-group">
            <label for="reg-name">Nombre</label>
            <input id="reg-name" type="text" placeholder="Tu nombre" />
          </div>
          <div class="input-group">
            <label for="reg-username">Usuario</label>
            <input id="reg-username" type="text" placeholder="Nombre de usuario" minlength="3" required />
          </div>
        </div>

        <div class="input-group">
          <label for="reg-email">Correo</label>
          <input id="reg-email" type="email" placeholder="tucorreo@dominio.com" required />
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="reg-pass">Contraseña</label>
            <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required />
          </div>
          <div class="input-group">
            <label for="reg-pass2">Confirmar</label>
            <input id="reg-pass2" type="password" placeholder="Repite tu contraseña" minlength="6" required />
          </div>
        </div>

        <label class="checkbox terms">
          <input type="checkbox" id="reg-terms" required />
          <span>Acepto los <a href="#" class="link">Términos y Condiciones</a></span>
        </label>

        <button type="submit" class="btn primary">Registrarme</button>

        <p class="switch">
          ¿Ya tienes cuenta? <a href="Login.html" class="link">Inicia sesión aquí</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 MySite — Todos los derechos reservados</p>
  </footer>

  <script>
    document.getElementById("register-panel").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = (document.getElementById('reg-name').value.trim()
               || document.getElementById('reg-username').value.trim()
               || 'Usuario');
  const email = document.getElementById('reg-email').value.trim();

  const displayName = name.charAt(0).toUpperCase() + name.slice(1);
  localStorage.setItem('user:name', displayName);
  localStorage.setItem('user:email', email);
  localStorage.setItem('user:logged', 'true');

  window.location.href = "PaginaPrincipal.html";
});

  </script>

 
<script src="userAuth.js"></script>

</body>
</html>
